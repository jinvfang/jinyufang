<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Project | Jinyu Fang</title>

  <link rel="shortcut icon" href="./assets/images/logo.ico" type="image/x-icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0f0f1a;
      --card-bg: #1a1a2e;
      --accent: #ffb100;
      --text-primary: #ffffff;
      --text-secondary: #d6d6e6;
      --text-muted: #9b9bb4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text-secondary);
      line-height: 1.6;
      min-height: 100vh;
    }

    .page-wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 32px;
      transition: color 0.2s ease;
    }

    .back-link:hover { color: var(--accent); }

    .project-category {
      color: var(--accent);
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: 1.5px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .project-title {
      color: var(--text-primary);
      font-size: clamp(26px, 4vw, 36px);
      line-height: 1.25;
      margin-bottom: 8px;
    }

    .project-date {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 28px;
    }

    .hero-image {
      width: 100%;
      max-height: 380px;
      object-fit: cover;
      border-radius: 16px;
      display: block;
      margin-bottom: 32px;
      background: var(--card-bg);
    }

    .detail-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 48px;
    }

    .detail-list li {
      position: relative;
      padding-left: 24px;
      font-size: 16px;
      color: var(--text-secondary);
    }

    .detail-list li::before {
      content: "▹";
      position: absolute;
      left: 0;
      color: var(--accent);
      font-size: 16px;
    }

    .more-projects {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 32px;
    }

    .more-projects h2 {
      color: var(--text-primary);
      font-size: 18px;
      margin-bottom: 18px;
    }

    .more-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .more-list a {
      display: block;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 15px;
      padding: 10px 14px;
      border-radius: 10px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .more-list a:hover {
      background: var(--card-bg);
      color: var(--accent);
    }

    .not-found {
      text-align: center;
      padding: 80px 20px;
    }

    .not-found h1 {
      color: var(--text-primary);
      font-size: 24px;
      margin-bottom: 12px;
    }

    .not-found a {
      color: var(--accent);
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="page-wrap" id="pageWrap">
    <!-- populated by script -->
  </div>

  <script>
    (function () {
      var projects = {
        "battery": {
          title: "Low-Tortuosity Battery Electrode Research",
          category: "Energy & Sustainability",
          date: "BU Mesostructured Materials & Devices Lab · Jul 2026 — Present",
          image: "./assets/images/project-1.jpg",
          bullets: [
            "Research-architected low-tortuosity electrodes using nonequilibrium soft-matter processing to enhance ion transport in high-energy-density batteries.",
            "Engineered dual-scale porosity to reduce capacity loss during fast lithiation for EV battery applications.",
            "Characterized interdigitated electrode architectures to optimize the balance between energy and power density.",
            "Fabricated 3D carbon-sheet architectures for applications spanning carbon capture to high-energy-density storage."
          ]
        },
        "pv": {
          title: "Photovoltaic Technology Impact Evaluation",
          category: "Energy & Sustainability",
          date: "Student Energy Sustainability Analyst · Jan 2025 — May 2025",
          image: "./assets/images/project-2.png",
          bullets: [
            "Assessed the crystal structure, bandgap, and commercial viability of leading photovoltaic materials, including monocrystalline silicon, Cadmium Telluride, and emerging perovskite solar cells.",
            "Quantified the Levelized Cost of Electricity and life-cycle carbon footprint across photovoltaic system types.",
            "Compared outputs from three large language models against peer-reviewed literature to validate technical claims on solar-cell performance and adoption trends."
          ]
        },
        "sustainable-house": {
          title: "Composting & Carbon Emissions Analysis",
          category: "Energy & Sustainability",
          date: "Sustainable House, Sydney · Jan 2026 — Jun 2026",
          image: "./assets/images/project-3.jpg",
          bullets: [
            "Analyzed carbon-emissions and food-waste data in Excel to inform suburb-wide waste-reduction targets.",
            "Managed and optimized aerobic composting units (\"Coolseats\") in the field.",
            "Authored reports converting complex sustainability data into actionable insights for community and utility stakeholders.",
            "Built composting infrastructure and led hands-on environmental education for a primary school class."
          ]
        },
        "truss": {
          title: "Optimized Acrylic Truss Design",
          category: "Design & Fabrication",
          date: "Student Mechanical Design Lead, EK301 · Feb 2025 — May 2025",
          image: "./assets/images/project-4.png",
          bullets: [
            "Designed and built an 8-joint Warren truss out of acrylic, prioritizing load capacity to achieve a predicted failure load of 65 oz.",
            "Developed a custom MATLAB program to calculate member axial forces and evaluate buckling thresholds.",
            "Conducted uncertainty analysis across nominal, strong, and weak case scenarios to establish confidence intervals for structural failure limits."
          ]
        },
        "color-sorter": {
          title: "Automated Color Sorter",
          category: "Design & Fabrication",
          date: "Engineering Design Student · Jun 2026 — Aug 2026",
          image: "./assets/images/project-5.png",
          bullets: [
            "Engineered a compact (2×2 ft) automated optical sorting device using microcontroller-based color-sensing algorithms across 5 color channels.",
            "Designed a hands-free feeding and transparent multi-bin sorting system for clean handling.",
            "Optimized electro-mechanical actuation and sensor integration to reliably sort 21 objects/min within a $200 budget."
          ]
        },
        "temp-sensor": {
          title: "Arduino Temperature Sensor Monitor",
          category: "Design & Fabrication",
          date: "Hands-On Engineering Student · Jan 2025 — May 2025",
          image: "./assets/images/project-6.png",
          bullets: [
            "Designed and built a portable Arduino-based sensor (TMP36) with live temperature display.",
            "Programmed the microcontroller to read the TMP36 sensor, display data on an LCD, and trigger visual/audio alerts upon exceeding a set range.",
            "Documented the entire design process in a final technical report, highlighting key engineering decisions and performance outcomes."
          ]
        },
        "steel-concrete": {
          title: "Material Properties of Steel & Concrete",
          category: "Testing & Materials",
          date: "Student Materials Testing Engineer, CIVL2201 · May 2026",
          image: "./assets/images/project-7.png",
          bullets: [
            "Conducted tension/compression tests on steel coupons and 35-day aged concrete cylinders per AS1391/AS1012.9 standards.",
            "Operated a 300 kN Sintech testing machine and a 2000 kN DARTEC testing machine to acquire load-and-displacement data.",
            "Calculated Young's Modulus, yield stress, ultimate strength, and ductility from stress-strain curves to characterize material failure behavior."
          ]
        },
        "c-channel": {
          title: "Steel C-Channel Beam Deflection Analysis",
          category: "Testing & Materials",
          date: "Student Structural Analyst, CIVL2201 · Mar 2026",
          image: "./assets/images/project-8.jpg",
          bullets: [
            "Measured vertical deflection of a simply supported steel C-channel under asymmetric incremental loading up to 222.5 N using dial gauges.",
            "Derived analytical deflection and bending moment expressions, validating experimental results within 10% of theoretical predictions."
          ]
        },
        "chem-capstone": {
          title: "General Chemistry Capstone: 12-Tungstosilicic Acid Synthesis",
          category: "Testing & Materials",
          date: "Capstone Researcher · Jan 2025 — May 2025",
          image: "./assets/images/project-9.png",
          bullets: [
            "Designed an experiment using literature research to synthesize and characterize 12-tungstosilicic acid using UV-Vis/IR spectroscopy.",
            "Assessed catalytic ineffectiveness in cyclohexanol dehydration via ¹H NMR, identifying impurities and proposing further optimization strategies such as solvent extraction.",
            "Communicated findings through a formal research paper and a colloquium presentation to peers and faculty."
          ]
        }
      };

      function esc(s) {
        var div = document.createElement("div");
        div.textContent = s;
        return div.innerHTML;
      }

      var params = new URLSearchParams(window.location.search);
      var id = params.get("id");
      var project = projects[id];
      var wrap = document.getElementById("pageWrap");

      if (!project) {
        wrap.innerHTML =
          '<div class="not-found">' +
            '<h1>Project not found</h1>' +
            '<p style="margin-bottom:20px;">The project you\'re looking for doesn\'t exist.</p>' +
            '<a href="index.html">&larr; Back to Portfolio</a>' +
          '</div>';
        return;
      }

      document.getElementById("pageTitle").textContent = project.title + " | Jinyu Fang";

      var bulletsHtml = project.bullets.map(function (b) {
        return "<li>" + esc(b) + "</li>";
      }).join("");

      var moreHtml = Object.keys(projects)
        .filter(function (key) { return key !== id; })
        .map(function (key) {
          return '<li><a href="project.html?id=' + key + '">' + esc(projects[key].title) + "</a></li>";
        }).join("");

      wrap.innerHTML =
        '<a class="back-link" href="index.html">&larr; Back to Portfolio</a>' +
        '<p class="project-category">' + esc(project.category) + "</p>" +
        '<h1 class="project-title">' + esc(project.title) + "</h1>" +
        '<p class="project-date">' + esc(project.date) + "</p>" +
        '<img class="hero-image" src="' + project.image + '" alt="' + esc(project.title) + '">' +
        '<ul class="detail-list">' + bulletsHtml + "</ul>" +
        '<section class="more-projects">' +
          "<h2>More Projects</h2>" +
          '<ul class="more-list">' + moreHtml + "</ul>" +
        "</section>";
    })();
  </script>

</body>

</html>
